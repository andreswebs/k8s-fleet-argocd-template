---
apiVersion: eks.amazonaws.com/v1
kind: TargetGroupBinding
metadata:
  name: argocd
  namespace: argocd
  annotations:
    ## deleting the binding deletes the target group it is bound to, and the
    ## target group belongs to the consumer's load balancer, not to this app.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  targetType: ip
  serviceRef:
    name: argocd-server
    port: 443
