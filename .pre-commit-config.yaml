---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-case-conflict
      - id: detect-private-key
        ## these carry dummy key headers on purpose: a credential example that
        ## does not look like the real thing is not much of an example
        exclude: ^(README\.md|examples/|docs/github-app-credentials\.md)
      - id: mixed-line-ending
