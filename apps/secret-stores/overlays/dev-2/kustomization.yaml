---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: patches/secrets-manager.clustersecretstore.yaml
    target:
      kind: ClusterSecretStore
      group: external-secrets.io
      version: v1
      name: aws-secrets-manager

  - path: patches/parameter-store.clustersecretstore.yaml
    target:
      kind: ClusterSecretStore
      group: external-secrets.io
      version: v1
      name: aws-parameter-store
