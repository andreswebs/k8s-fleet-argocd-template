---
createClusterRoles: true

crds:
  install: true
  keep: false

global:
  additionalLabels:
    app: argo-cd
  revisionHistoryLimit: 3

  image:
    repository: quay.io/argoproj/argocd
    tag: ""
    imagePullPolicy: IfNotPresent

  logging:
    format: json
    level: info

  networkPolicy:
    ## chart 8 and later default this to true, which renders six NetworkPolicy
    ## objects covering every Argo CD component. those are live rules on any
    ## cluster whose CNI enforces them, EKS Auto Mode included, so enabling them
    ## blindly can cut off ingress to the UI and metrics scrapes. a consumer
    ## opts in per cluster after testing both.
    create: false

configs:
  cm:
    create: true
    exec.enabled: false
    admin.enabled: true
    timeout.reconciliation: 180s
    timeout.hard.reconciliation: 0s
    statusbadge.enabled: false
    kustomize.buildOptions: --enable-helm --load-restrictor LoadRestrictionsNone

  params:
    create: true

  secret:
    createSecret: true

server:
  name: server

  ## required, not optional: both autoscaling targets below are utilisation
  ## percentages, and utilisation is a percentage of the request. without
  ## requests the HPA cannot compute a replica count, reports
  ## ScalingActive=False, and Argo CD marks this Application Degraded.
  ## these are the chart's own suggested requests. size them from real figures
  ## on a cluster that matters.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 50
