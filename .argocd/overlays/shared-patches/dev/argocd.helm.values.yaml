---
## to opt this environment into the chart's NetworkPolicy objects, uncomment
## the whole block below, once ingress to the UI and metrics scrapes have been
## tested against them. keep `global` itself commented while it has no live
## keys: a `global:` with only comments under it parses as null, and helm
## treats an explicit null as a deletion, which would wipe the entire global
## block set in the base values.
# global:
#   networkPolicy:
#     create: true

configs:
  cm:
    exec.enabled: true
