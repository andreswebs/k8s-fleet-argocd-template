---
installCRDs: true

serviceAccount:
  create: true
  automount: true
  ## an EKS Pod Identity association or IRSA trust policy names this service
  ## account, so renaming it cuts the controller off from AWS. see
  ## apps/secret-stores/README.md for the IAM contract
  name: external-secrets
  annotations: {}

resources:
  requests:
    cpu: 10m
    memory: 32Mi
