---
apiVersion: eks.amazonaws.com/v1
kind: TargetGroupBinding
metadata:
  name: argocd-grpc
  namespace: argocd
  annotations:
    ## deleting the binding deletes the target group it is bound to, and the
    ## target group belongs to the consumer's load balancer, not to this app.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  targetType: ip
  ## both bindings point at the same Service and the same pod port, which
  ## serves HTTP and gRPC alike. they differ only in the protocol version of
  ## the target group each is bound to, HTTP1 for the web one and GRPC here.
  serviceRef:
    name: argocd-server
    port: 443
