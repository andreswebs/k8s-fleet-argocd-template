---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Workload components
  ## left open because workloads commonly live in their own repositories. it
  ## can be narrowed the same way as the other projects; the Helm charts an
  ## overlay inflates with kustomize need no entry, since sourceRepos governs
  ## only an Application's own source.
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
