---
- op: add
  path: /spec/generators
  value:
    - matrix:
        generators:
          - list:
              elements:
                - clusterName: local
          - list:
              elements:
                ## three applications the other clusters run are absent here,
                ## because none of them can work without AWS:
                ##   secret-stores   reads AWS Secrets Manager
                ##   argocd-secrets  mints an ECR authorization token
                ##   argocd-ingress  needs the EKS Auto Mode controller

                - name: cert-manager
                  namespace: cert-manager
                  path: apps/cert-manager/overlays/{{.clusterName}}
                  wave: 0

                - name: external-secrets
                  namespace: external-secrets
                  path: apps/external-secrets/overlays/{{.clusterName}}
                  wave: 0
                  ## the chart CRDs exceed the client-side apply annotation size limit
                  syncServerSideApply: true

                - name: metrics-server
                  namespace: kube-system
                  path: apps/metrics-server/overlays/{{.clusterName}}
                  wave: 0

                - name: o11y
                  namespace: o11y
                  path: apps/o11y/overlays/{{ .clusterName }}
                  wave: 2
                  syncServerSideApply: true
