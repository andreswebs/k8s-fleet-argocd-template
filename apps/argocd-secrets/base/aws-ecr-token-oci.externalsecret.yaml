---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-ecr-token-oci
  namespace: argocd
spec:
  refreshInterval: 30m
  target:
    name: aws-ecr-token-oci
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: helm
        name: helm ## TODO: example
        enableOCI: "true"
        ## the template replaces the generator's output rather than merging with
        ## it, so a key not named here is dropped and Argo CD gets no credential.
        ## named one by one rather than with mergePolicy: Merge, which would also
        ## copy proxy_endpoint and expires_at into the repository Secret
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: aws-ecr-token
