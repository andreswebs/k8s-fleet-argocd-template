---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  finalizers:
    ## unqualified on purpose, unlike the Applications' /foreground form. Argo
    ## CD removes only this exact name from an AppProject, so any other would
    ## leave the project undeletable. Kubernetes warns about it on apply; the
    ## warning is harmless and lasts until Argo CD accepts a qualified name
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Workload components
  ## left open because workloads commonly live in their own repositories. it
  ## can be narrowed the same way as the other projects; the Helm charts an
  ## overlay inflates with kustomize need no entry, since sourceRepos governs
  ## only an Application's own source.
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
