---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    ## root manages this Application and deletes what it manages, so without
    ## this a cascading delete of root would uninstall Argo CD with it
    argocd.argoproj.io/sync-options: Delete=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: self
  source:
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    retry:
      limit: 2
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - Replace=false
      - ServerSideApply=true
