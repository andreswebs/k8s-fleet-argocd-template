---
extends: default

ignore:
  - "**/**/charts"
  - ".render/"

rules:
  document-start: enable
  truthy: enable
  line-length:
    max: 120
    level: warning
  comments:
    ## the repository writes inline comments as `value: # TODO` and
    ## `value: us-east-2 # TODO`, one space from the content. the default of two
    ## would mean reformatting every placeholder to satisfy a rule about
    ## whitespace, so the rule is relaxed instead.
    min-spaces-from-content: 1
