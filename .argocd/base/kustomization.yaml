---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

## the namespace ships with the bootstrap so a fresh cluster needs no manual
## step before the first apply. every app under apps/ carries its own the same
## way. the self-managing Application keeps CreateNamespace=false, because this
## is a rendered resource rather than a sync option.
resources:
  - argocd.ns.yaml
